name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm release:check
      - run: pnpm test
      - run: pnpm docgen
      - name: Validate generated OpenCLI with the published action
        uses: bhouston/clidoc-action@v1
        with:
          files: opencli.json
          specification: bcdxn
          format: json
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Verify published package includes dist
        run: |
          pnpm pack --dry-run | grep -qx 'dist/bin/bhouston-link-checker.js' || {
            echo "::error::dist/bin/bhouston-link-checker.js missing from the packed tarball; the publish step would ship a broken package."
            exit 1
          }
