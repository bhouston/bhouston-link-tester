name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm release:check
      - run: pnpm test
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Verify published package includes dist
        run: |
          node scripts/make-release.ts . --assemble-only
          npm pack --dry-run ./publish | tee pack-output.log
          grep -qE '\bdist/bin/bhouston-link-checker\.js$' pack-output.log || {
            echo "::error::dist/bin/bhouston-link-checker.js missing from the packed tarball; the publish step would ship a broken package."
            exit 1
          }
